<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛孩精品館 - 寵物用品購物網</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* 避免彈出視窗開啟時背景滾動 */
        body.modal-open { overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 8 項寵物商品資料，新增了 description (詳細介紹)
        const products = [
            { 
                id: 1, 
                name: '頂級無穀鮮肉狗飼料', 
                price: 850, 
                image: 'https://encrypted-tbn2.gstatic.com/licensed-image?q=tbn:ANd9GcQdt-jumKWKywMkSeJstpcw0wfMaznJRyYVCZvjaYkSP8xGY0Rs0caaGclqak9Yfu8cLz3MbkmYvKXldBw',
                description: '採用 100% 紐西蘭放牧草飼牛，搭配多種新鮮蔬果，無穀低敏配方，給狗狗最天然的營養補給。特別添加專利益生菌，幫助腸胃消化吸收，讓毛孩毛髮亮麗、活力充沛。'
            },
            { 
                id: 2, 
                name: '營養滿分海鮮貓糧', 
                price: 720, 
                image: 'https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcRnmdv9JU9jRYmidC1jsVgwGxxg8KAOWZnjuW4k7znTj4yHwRa7Vx74E5y9RK5HJiAS-vVzZ15yb-C2FQs',
                description: '嚴選深海鮭魚及鱈魚作為單一蛋白質來源，豐富的 Omega-3 與 Omega-6 幫助護膚亮毛。添加蔓越莓萃取物，守護愛貓泌尿道健康，適口性極佳，挑嘴貓也愛不釋口。'
            },
            { 
                id: 3, 
                name: '舒適安眠柔軟寵物床', 
                price: 1200, 
                image: 'https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcS5ESlb_a4dJs0uFRq0rOAGZcDqTG4yvEV4xL3joVlCJ0Trubeubek-EfchXDjuPXfLcfZ1LMyqh9gPNuQ',
                description: '採用頂級舒柔法蘭絨材質，內填高彈力 PP 棉，如雲朵般的包覆感給毛孩極致的睡眠體驗。底部防滑點塑設計不易移位，全可拆洗套設計，清潔衛生更方便。'
            },
            { 
                id: 4, 
                name: '互動式羽毛逗貓棒', 
                price: 150, 
                image: 'https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcTo6C2hxhySjMzcXADEsIybfF8CFqLBnQeUw7WdIUdjuKjorbiE2S9Oc8PL54ov82n7FgBnsqe1smkupRE',
                description: '仿生鳥飛翔軌跡設計的逗貓棒，頂端附有天然羽毛與清脆小鈴鐺，能瞬間激發貓咪的狩獵本能。高韌性碳纖維桿身，耐彎折不易斷，是增進主子與奴才感情的最佳利器。'
            },
            { 
                id: 5, 
                name: '反光耐用犬用牽繩', 
                price: 350, 
                image: 'https://encrypted-tbn3.gstatic.com/licensed-image?q=tbn:ANd9GcQinyXdpvwLh6UpifVTBmgrawFcdxfXCzTe0CgoYw42YacGj55dUm_FG6hDLqXpfL9kq_Gj287BSN_KNDE',
                description: '高強度尼龍編織而成，可承受大型犬拉扯。雙面高亮度反光條設計，保障夜間散步的安全。把手處採用加厚潛水布潛水料軟墊，不勒手，讓主人遛狗更輕鬆自在。'
            },
            { 
                id: 6, 
                name: '防滑陶瓷護頸寵物碗', 
                price: 280, 
                image: 'https://encrypted-tbn3.gstatic.com/licensed-image?q=tbn:ANd9GcQTmxlGP0wAE7OutJRKESJ894cxTB4oaU-mjq9D6TV-J3lLoajJ7e9ZfDmuq8s_vF0HISb3iMQ07wQg-3I',
                description: '符合寵物人體工學的 15 度傾斜與加高設計，有效降低毛孩進食時頸椎受壓，防止嘔吐。食品級高溫燒製陶瓷，不易產生黑下巴，清洗容易，底部附防滑矽膠圈不怕打翻。'
            },
            { 
                id: 7, 
                name: '豪華多層貓跳台', 
                price: 2500, 
                image: 'https://encrypted-tbn3.gstatic.com/licensed-image?q=tbn:ANd9GcRVOFmodBudqhTowkxPYwHw3SJohCb2m9AjHrk2naHNKRhl85v-0zEf6yumgp4Vve-N2E4kDbtOvcjATZ8',
                description: '集結劍麻抓柱、隱蔽貓窩、瞭望台於一體的豪華城堡。優質天然劍麻繩緊密纏繞，耐抓不掉屑。加厚底座設計穩如泰山，多隻貓咪同時玩耍也安全無虞，給貓咪最棒的遊樂園。'
            },
            { 
                id: 8, 
                name: '溫和草本寵物沐浴乳', 
                price: 450, 
                image: 'https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcQ1ZUhfHcMWPoN3jn7MVtzsJKMXVvxrd9zjlv2l5nEn-BCew2eyfJlRB_ppR4QuI_WcFb8uh0It1mijsd8',
                description: '獸醫師推薦配方！採用蘆薈、燕麥與洋甘菊等純植物萃取成分，無矽靈、無人工香精。PH值中性溫和不刺激，深層清潔的同時舒緩敏感肌膚，洗後毛髮蓬鬆自帶淡雅清香。'
            }
        ];

        const App = () => {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null); // 控制當前查看的商品詳情

            // 處理視窗滾動鎖定
            useEffect(() => {
                if (selectedProduct || isCartOpen) {
                    document.body.classList.add('modal-open');
                } else {
                    document.body.classList.remove('modal-open');
                }
            }, [selectedProduct, isCartOpen]);

            const addToCart = (product) => {
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    setCart(cart.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item));
                } else {
                    setCart([...cart, { ...product, quantity: 1 }]);
                }
                setIsCartOpen(true);
            };

            const removeFromCart = (id) => setCart(cart.filter(item => item.id !== id));

            const updateQuantity = (id, delta) => {
                setCart(cart.map(item => {
                    if (item.id === id) {
                        const newQuantity = item.quantity + delta;
                        return newQuantity > 0 ? { ...item, quantity: newQuantity } : item;
                    }
                    return item;
                }));
            };

            const totalAmount = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* 頂部導覽列 */}
                    <header className="bg-white shadow-sm p-4 sticky top-0 z-10">
                        <div className="max-w-6xl w-full mx-auto flex justify-between items-center">
                            <h1 className="text-2xl font-extrabold text-amber-600 flex items-center gap-2 cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                                🐾 毛孩精品館
                            </h1>
                            <button 
                                onClick={() => setIsCartOpen(!isCartOpen)}
                                className="relative p-2 bg-amber-50 rounded-full hover:bg-amber-100 transition-colors"
                            >
                                <span className="text-xl">🛒</span>
                                {totalItems > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold shadow">
                                        {totalItems}
                                    </span>
                                )}
                            </button>
                        </div>
                    </header>

                    {/* 商品列表區塊 */}
                    <main className="flex-1 max-w-6xl w-full mx-auto p-6">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                            {products.map(product => (
                                <div key={product.id} className="bg-white rounded-2xl shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden flex flex-col border border-gray-100 group">
                                    {/* 點擊圖片或標題開啟詳情視窗 */}
                                    <div 
                                        className="cursor-pointer"
                                        onClick={() => setSelectedProduct(product)}
                                    >
                                        <div className="h-56 overflow-hidden bg-white flex items-center justify-center p-4 relative">
                                            <img 
                                                src={product.image} 
                                                alt={product.name} 
                                                className="max-w-full max-h-full object-contain group-hover:scale-105 transition-transform duration-500" 
                                            />
                                            {/* 懸停時顯示查看詳情提示 */}
                                            <div className="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition-all flex items-center justify-center">
                                                <span className="opacity-0 group-hover:opacity-100 bg-white text-gray-800 text-sm font-bold py-1.5 px-3 rounded-full shadow-md transform translate-y-2 group-hover:translate-y-0 transition-all">
                                                    查看詳情
                                                </span>
                                            </div>
                                        </div>
                                        <div className="px-5 pt-4">
                                            <h3 className="text-lg font-bold text-gray-800 group-hover:text-amber-600 transition-colors">{product.name}</h3>
                                            <p className="text-amber-600 font-black text-xl mt-1">NT$ {product.price.toLocaleString()}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="px-5 pb-5 mt-auto pt-4">
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation(); // 避免點擊按鈕時觸發了外層的開啟詳情
                                                addToCart(product);
                                            }}
                                            className="w-full bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white py-2.5 rounded-xl font-bold transition-colors shadow-sm"
                                        >
                                            加入購物車
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* === 商品詳細資訊彈出視窗 (Modal) === */}
                    {selectedProduct && (
                        <div 
                            className="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity"
                            onClick={() => setSelectedProduct(null)} // 點擊背景關閉
                        >
                            <div 
                                className="bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto flex flex-col md:flex-row shadow-2xl relative animate-[fadeIn_0.3s_ease-out]"
                                onClick={e => e.stopPropagation()} // 點擊內容區不關閉
                            >
                                {/* 關閉按鈕 */}
                                <button 
                                    onClick={() => setSelectedProduct(null)} 
                                    className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 bg-gray-100 hover:bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center transition-colors z-10"
                                >
                                    ✖
                                </button>

                                {/* 左側圖片區 */}
                                <div className="md:w-1/2 bg-gray-50 flex items-center justify-center p-8 min-h-[300px]">
                                    <img 
                                        src={selectedProduct.image} 
                                        alt={selectedProduct.name} 
                                        className="max-w-full max-h-[400px] object-contain hover:scale-105 transition-transform duration-500" 
                                    />
                                </div>

                                {/* 右側資訊區 */}
                                <div className="md:w-1/2 p-8 md:p-10 flex flex-col justify-center bg-white">
                                    <div className="mb-2 text-xs font-bold text-amber-500 tracking-wider">熱銷商品</div>
                                    <h2 className="text-2xl md:text-3xl font-extrabold text-gray-800 mb-2 leading-tight">
                                        {selectedProduct.name}
                                    </h2>
                                    <p className="text-amber-600 font-black text-3xl mb-6">
                                        NT$ {selectedProduct.price.toLocaleString()}
                                    </p>
                                    
                                    <div className="w-full h-px bg-gray-100 mb-6"></div>
                                    
                                    <div className="text-gray-600 mb-8 leading-relaxed">
                                        <h4 className="font-bold text-gray-800 mb-2">商品介紹</h4>
                                        <p className="mb-4">{selectedProduct.description}</p>
                                        <ul className="space-y-2 text-sm text-gray-500">
                                            <li className="flex items-center gap-2">✅ 現貨供應中，今日下單明日出貨</li>
                                            <li className="flex items-center gap-2">✅ 享 7 天鑑賞期，購物安心有保障</li>
                                            <li className="flex items-center gap-2">✅ 全館滿千免運費</li>
                                        </ul>
                                    </div>
                                    
                                    <div className="mt-auto pt-4">
                                        <button
                                            onClick={() => {
                                                addToCart(selectedProduct);
                                                setSelectedProduct(null); // 加入購物車後自動關閉介紹視窗
                                            }}
                                            className="w-full bg-amber-500 hover:bg-amber-600 text-white py-4 rounded-xl font-bold transition-all shadow-md text-lg hover:-translate-y-0.5"
                                        >
                                            ＋ 加入購物車
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* === 購物車側邊滑出面板與遮罩 === */}
                    {isCartOpen && (
                        <div 
                            className="fixed inset-0 bg-black bg-opacity-40 z-30 transition-opacity backdrop-blur-sm"
                            onClick={() => setIsCartOpen(false)}
                        ></div>
                    )}

                    <aside 
                        className={`fixed top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-40 transform transition-transform duration-300 ease-in-out flex flex-col ${isCartOpen ? 'translate-x-0' : 'translate-x-full'}`}
                    >
                        <div className="p-5 border-b flex justify-between items-center bg-amber-50">
                            <h2 className="text-xl font-bold text-gray-800">購物車明細 ({totalItems})</h2>
                            <button onClick={() => setIsCartOpen(false)} className="text-gray-400 hover:text-gray-700 w-8 h-8 flex items-center justify-center rounded-full hover:bg-white transition-colors">
                                ✖
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-5 space-y-4">
                            {cart.length === 0 ? (
                                <div className="text-center text-gray-400 mt-20">
                                    <div className="text-6xl mb-4 opacity-50">🛍️</div>
                                    <p className="text-lg font-medium">購物車目前是空的喔！</p>
                                    <p className="text-sm mt-2">快去幫毛孩挑選喜歡的禮物吧</p>
                                </div>
                            ) : (
                                cart.map(item => (
                                    <div key={item.id} className="flex gap-4 items-center bg-white p-3 rounded-xl border border-gray-100 shadow-sm hover:border-amber-200 transition-colors">
                                        <img src={item.image} alt={item.name} className="w-20 h-20 rounded-lg object-contain bg-white" />
                                        <div className="flex-1">
                                            <h4 className="font-bold text-sm text-gray-700 line-clamp-1">{item.name}</h4>
                                            <p className="text-amber-600 text-sm font-black mt-1">NT$ {item.price.toLocaleString()}</p>
                                            
                                            <div className="flex items-center justify-between mt-3">
                                                <div className="flex items-center gap-1 bg-gray-100 rounded-lg p-1">
                                                    <button onClick={() => updateQuantity(item.id, -1)} className="w-6 h-6 rounded bg-white shadow-sm flex items-center justify-center text-gray-600 hover:text-amber-600 font-bold">-</button>
                                                    <span className="text-sm font-bold w-6 text-center">{item.quantity}</span>
                                                    <button onClick={() => updateQuantity(item.id, 1)} className="w-6 h-6 rounded bg-white shadow-sm flex items-center justify-center text-gray-600 hover:text-amber-600 font-bold">+</button>
                                                </div>
                                                <button onClick={() => removeFromCart(item.id)} className="text-red-400 hover:text-red-600 hover:bg-red-50 p-1.5 rounded transition-colors" title="刪除商品">
                                                    🗑️
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="p-6 border-t bg-gray-50">
                            <div className="flex justify-between items-center mb-5">
                                <span className="font-bold text-gray-500">總計金額:</span>
                                <span className="text-2xl font-black text-amber-600">NT$ {totalAmount.toLocaleString()}</span>
                            </div>
                            <button 
                                className={`w-full py-3.5 rounded-xl font-bold text-lg text-white transition-all shadow-md ${cart.length === 0 ? 'bg-gray-300 cursor-not-allowed shadow-none' : 'bg-green-500 hover:bg-green-600 hover:-translate-y-0.5'}`}
                                disabled={cart.length === 0}
                                onClick={() => { 
                                    alert('結帳成功！感謝您的購買 🐾 \n總金額為 NT$ ' + totalAmount.toLocaleString()); 
                                    setCart([]); 
                                    setIsCartOpen(false); 
                                }}
                            >
                                前往結帳
                            </button>
                        </div>
                    </aside>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
